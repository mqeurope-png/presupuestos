name: Build release zip

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.7.7)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Package plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build zip
        run: |
          mkdir -p build/bomedia-quote-wizard
          rsync -a --exclude='.git' \
                   --exclude='.github' \
                   --exclude='node_modules' \
                   --exclude='vendor' \
                   --exclude='*.log' \
                   --exclude='build' \
                   --exclude='.gitignore' \
                   --exclude='*.zip' \
                   ./ build/bomedia-quote-wizard/
          cd build && zip -r "../bomedia-quote-wizard-${{ steps.ver.outputs.tag }}.zip" bomedia-quote-wizard

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bomedia-quote-wizard
          path: bomedia-quote-wizard-*.zip

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: bomedia-quote-wizard-*.zip
